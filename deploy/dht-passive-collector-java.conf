[Unit]
Description=Mainline DHT collector and metadata worker (Java)

[Service]
TimeoutStartSec=90s
ExecStartPre=/usr/bin/find /root/vibe/dht-collector/var/java-dht -type f -name IPv4-table.cache -size 0 -delete
ExecStart=
ExecStart=/usr/bin/java -Xms64m -Xmx640m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -jar /opt/dht-collector/dht-collector-java.jar --mode collector --address 0.0.0.0 --port 51413 --dht-nodes 8 --max-concurrent 160 --metadata-concurrent 16 --metadata-timeout-seconds 8 --pool-size 4 --storage-path /root/vibe/dht-collector/var/java-dht
SuccessExitStatus=143
MemoryHigh=700M
MemoryMax=900M
OOMPolicy=stop
